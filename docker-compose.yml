services:
  work:
    image: rocker/verse:4.5.0
    container_name: quarto-work
    volumes:
      - .:/home/rstudio/project
    working_dir: /home/rstudio/project
    tty: true
    stdin_open: true
    command: sleep infinity

  render:
    user: "${UID:-1000}:${GID:-1000}"
    image: rocker/verse:4.5.0
    container_name: quarto-render
    volumes:
      - .:/home/rstudio/project
    working_dir: /home/rstudio/project
    command: quarto render index.qmd

  preview:
    image: rocker/verse:4.5.0
    container_name: quarto-preview
    volumes:
      - .:/home/rstudio/project
    working_dir: /home/rstudio/project
    ports:
      - "4200:4200"
    command: quarto preview index.qmd --host 0.0.0.0 --port 4200
